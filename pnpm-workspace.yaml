# Configuración de pnpm (pnpm 11 lee los settings de este archivo).
# Scripts de instalación: bloqueados salvo los listados con `true`.
# Hoy ninguna dependencia necesita compilar (bcryptjs es JS puro);
# @scarf/scarf (telemetría de swagger-ui-dist) queda denegado explícitamente.
allowBuilds:
  '@scarf/scarf': false

# No instalar versiones publicadas hace menos de 3 días (en minutos).
minimumReleaseAge: 4320
